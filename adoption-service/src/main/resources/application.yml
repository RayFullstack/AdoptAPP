server:
  port: 8083
  servlet:
    context-path: "/adoption-app"

spring:
  application:
    name: adoption-service

  datasource:
    url: jdbc:h2:mem:adoption_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

services:
  user-service:
    url: http://localhost:8081/user-app
  pet-service:
    url: http://localhost:8082/pet-app

logging:
  level:
    com.adoptapp: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%-5level] %logger{0} - %msg%n"
  file:
    name: logs/adoptions.log
