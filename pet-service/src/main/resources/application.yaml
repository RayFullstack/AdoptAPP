server:
  port: 8082

spring:
  application:
    name: pet-service

  datasource:
    url: jdbc:postgresql://localhost:5432/pet_db
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG